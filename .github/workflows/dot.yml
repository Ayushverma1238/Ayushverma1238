name: Generate Contribution Dot

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch: {}    # allows manual runs from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate dot animation
        env:
          GH_USERNAME: AyushVerma1238
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node generate-dot.js

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
