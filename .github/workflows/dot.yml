name: Generate Contribution Dot

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Contribution Dot
        env:
          GH_USERNAME: Ayushverma1238
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node generate-dot.js

      # Download existing output branch so we don't overwrite the snake
      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output
          path: output
        continue-on-error: true

      - name: Copy existing files
        run: |
          mkdir -p output
          cp -r output/* dist/ 2>/dev/null || true
          cp dist/contribution-dot.svg dist/contribution-dot.svg

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          force_orphan: false
